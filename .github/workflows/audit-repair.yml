name: Audit repair

# Repairs a failed `Main` run on the `audit-autofix` branch with the deterministic steps of
# `.github/scripts/audit-repair.mts plan` (allowScripts, dedupe, LavaMoat policy) and pushes
# one commit, so CI runs again. A failure that needs a code change goes to a sandboxed agent
# (Claude Code through LiteLLM) with `.github/audit-autofix/repair-prompt.md`; the workflow then
# re-runs the failing check itself before it pushes. Anything else is only reported.
# The scripts and prompts run from the default branch (`.tmp/trusted`), never from the branch under repair.

on:
  workflow_run:
    workflows: [Main]
    types: [completed]
    branches: [audit-autofix]
  workflow_dispatch:
    inputs:
      run-id:
        description: 'Failed Main run to plan and repair'
        required: true
        type: string
      dry-run:
        description: 'Do everything except pushing. Required for a branch other than audit-autofix'
        default: true
        type: boolean

permissions: {}

concurrency:
  group: audit-repair-${{ github.event.workflow_run.head_branch || inputs.run-id }}
  cancel-in-progress: false

env:
  LITELLM_BASE_URL: https://litellm.consensys.info
  MODEL: claude-sonnet-5-5
  CLAUDE_CODE_VERSION: 2.1.323
  WORK_DIR: .tmp/audit-repair
  REPAIR_CAP: '3'
  DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}

jobs:
  repair:
    name: Plan and repair
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      head-branch: ${{ steps.run.outputs.head-branch }}
      run-id: ${{ steps.run.outputs.run-id }}
      repairs: ${{ steps.base.outputs.repairs }}
      outcome: ${{ steps.outcome.outputs.outcome }}
      sha: ${{ steps.outcome.outputs.sha }}
    steps:
      - name: Resolve the failed run
        id: run
        uses: actions/github-script@v9
        env:
          INPUT_RUN_ID: ${{ inputs.run-id }}
        with:
          script: |
            const event = context.payload.workflow_run;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: Number(process.env.INPUT_RUN_ID || event.id),
            });
            // The event names the attempt that just failed; the API names the latest, which a rerun may already have moved on.
            core.setOutput('run-id', run.id);
            core.setOutput('head-branch', run.head_branch);
            core.setOutput('head-sha', run.head_sha);
            core.setOutput('attempt', event?.run_attempt ?? run.run_attempt);

      - name: Check the branch
        env:
          HEAD_BRANCH: ${{ steps.run.outputs.head-branch }}
        run: |
          case "$HEAD_BRANCH" in
            audit-autofix) ;;
            *)
              # TEMPORARY (1/1): lets a dry run plan a failed fork test branch. Remove once an
              # audit-autofix PR has been repaired by this workflow.
              if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$DRY_RUN" != true ]; then
                echo "::error::Only a dry run may repair $HEAD_BRANCH"
                exit 1
              fi
              ;;
          esac

      - name: Checkout and install the branch
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          # TEMPORARY (1/1): false while this workflow is developed. Set to true when the PR is opened.
          is-high-risk-environment: false
          ref: ${{ steps.run.outputs.head-sha }}
          persist-credentials: false
          # Installed below, because a stale allowScripts entry makes the install itself fail.
          skip-install: true

      - name: Checkout the trusted scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .tmp/trusted
          sparse-checkout: |
            .github/scripts
            .github/audit-autofix
          persist-credentials: false

      # The planner imports packages from node_modules, so install first. A stale allowScripts entry
      # fails the install itself; it is judged after the plan.
      - name: Install the branch
        run: |
          if yarn --immutable; then
            echo "INSTALL_FAILED=false" >> "$GITHUB_ENV"
          else
            echo "INSTALL_FAILED=true" >> "$GITHUB_ENV"
          fi

      - name: Find the branch point and earlier repairs
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ steps.run.outputs.head-sha }}
        run: |
          mkdir -p "$WORK_DIR"
          gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$HEAD_SHA" > "$WORK_DIR/compare.json"
          base=$(jq -r .merge_base_commit.sha "$WORK_DIR/compare.json")
          # Only repairs after the last autofix commit count: a rolling autofix run resets the cap.
          node .tmp/trusted/.github/scripts/audit-repair.mts history --compare "$WORK_DIR/compare.json" >> "$GITHUB_OUTPUT"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin "$base"
          git show "$base:package.json" > "$WORK_DIR/package.base.json"
          git show "$base:yarn.lock" > "$WORK_DIR/yarn.base.lock"

      - name: Plan the repair
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run-id }}
          ATTEMPT: ${{ steps.run.outputs.attempt }}
          REPAIRS: ${{ steps.base.outputs.repairs }}
          PREVIOUS_SIGNATURE: ${{ steps.base.outputs.previous-signature }}
        run: |
          args=(plan --run-id "$RUN_ID" --repo "$GITHUB_REPOSITORY" --attempt "$ATTEMPT" --repairs "$REPAIRS" --cap "$REPAIR_CAP")
          if [ -n "$PREVIOUS_SIGNATURE" ]; then
            args+=(--previous-signature "$PREVIOUS_SIGNATURE")
          fi
          node .tmp/trusted/.github/scripts/audit-repair.mts "${args[@]}" > "$WORK_DIR/plan.json"
          jq '.plan' "$WORK_DIR/plan.json"
          {
            echo "action=$(jq -r .plan.action "$WORK_DIR/plan.json")"
            echo "steps=$(jq -c .plan.steps "$WORK_DIR/plan.json")"
            echo "signature=$(jq -r .plan.signatureHash "$WORK_DIR/plan.json")"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Audit repair plan'
            echo '```json'
            jq '.plan' "$WORK_DIR/plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require a working install
        if: ${{ steps.plan.outputs.action == 'repair' || steps.plan.outputs.action == 'llm' }}
        env:
          STEPS: ${{ steps.plan.outputs.steps }}
        run: |
          if [ "$INSTALL_FAILED" = true ]; then
            # The allowScripts repair below fixes the entry that broke the install.
            if jq -e 'index("allow-scripts")' <<< "$STEPS" > /dev/null; then
              echo "::warning::The install failed; the allow-scripts repair follows."
            else
              echo "::error::The install failed and no allow-scripts repair is planned."
              exit 1
            fi
          fi

      - name: Rerun the failed jobs once
        if: ${{ steps.plan.outputs.action == 'retry' && env.DRY_RUN != 'true' }}
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ steps.run.outputs.run-id }}
          ATTEMPT: ${{ steps.run.outputs.attempt }}
          HAS_PAT: ${{ secrets.AUDIT_AUTOFIX_PAT != '' }}
        with:
          github-token: ${{ secrets.AUDIT_AUTOFIX_PAT || github.token }}
          script: |
            if (process.env.HAS_PAT !== 'true') {
              core.setFailed('AUDIT_AUTOFIX_PAT is not set.');
              return;
            }
            const params = { ...context.repo, run_id: Number(process.env.RUN_ID) };
            const { data: run } = await github.rest.actions.getWorkflowRun(params);
            // triage-and-retry-system.yml also reruns flaky PR runs; do not start a second rerun.
            if (run.run_attempt > Number(process.env.ATTEMPT)) {
              core.notice(`Run ${run.id} is already on attempt ${run.run_attempt}; another workflow reran it.`);
              return;
            }
            try {
              await github.rest.actions.reRunWorkflowFailedJobs(params);
            } catch (error) {
              // Another rerun started between the check and the call.
              if (!/already running|cannot be rerun/iu.test(error.message)) {
                throw error;
              }
              core.notice(`Run ${run.id} was rerun by another workflow just now.`);
            }

      - name: Report a failure this workflow does not repair
        if: ${{ steps.plan.outputs.action == 'needs-human' }}
        run: echo "::warning::Plan is needs-human; no repair applies. See the plan in the job summary."

      - name: Prepare the agent inputs
        id: inputs
        if: ${{ steps.plan.outputs.action == 'llm' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .tmp/trusted/.github/scripts/audit-repair.mts prepare \
            --plan "$WORK_DIR/plan.json" --repo "$GITHUB_REPOSITORY" \
            --base-package "$WORK_DIR/package.base.json" --base-lock "$WORK_DIR/yarn.base.lock"
          echo "kinds=$(jq -c .kinds .tmp/audit-autofix/repair/failure.json)" >> "$GITHUB_OUTPUT"

      - name: Install bubblewrap, socat and a narrow AppArmor profile
        if: ${{ steps.plan.outputs.action == 'llm' }}
        run: |
          sudo apt-get install -y bubblewrap socat
          # 26.04 ships a stock bwrap profile whose restricted child blocks the nested user
          # namespace that Claude Code's seccomp helper needs, so replace it.
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
            sudo rm /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --unshare-user --dev /dev unshare -U true
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      # The key lives in a file that only apiKeyHelper (run by Claude outside the sandbox) can read.
      - name: Write the gateway key file
        if: ${{ steps.plan.outputs.action == 'llm' }}
        env:
          GATEWAY_KEY: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/gateway-key"
          printf '%s' "$GATEWAY_KEY" > "$RUNNER_TEMP/gateway-key"

      - name: Run the repair agent in the Claude Code sandbox
        id: agent
        if: ${{ steps.plan.outputs.action == 'llm' }}
        timeout-minutes: 40
        # A failed or timed-out agent leaves nothing to push: the verify step requires success.
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: ${{ env.LITELLM_BASE_URL }}
          BASH_DEFAULT_TIMEOUT_MS: '1800000'
          BASH_MAX_TIMEOUT_MS: '1800000'
        run: |
          mkdir -p ~/.cache ~/.yarn ~/.npm ~/.config ~/.ssh ~/agent-bin
          # Yarn ignores the standard proxy variables, so the sandbox needs this wrapper.
          real_yarn=$(command -v yarn)
          # shellcheck disable=SC2016 # the wrapper must keep ${...} literal until it runs
          printf '#!/usr/bin/env bash\nexport YARN_HTTP_PROXY="${YARN_HTTP_PROXY:-$HTTP_PROXY}" YARN_HTTPS_PROXY="${YARN_HTTPS_PROXY:-$HTTPS_PROXY}"\nexec %s "$@"\n' "$real_yarn" > ~/agent-bin/yarn
          chmod +x ~/agent-bin/yarn
          settings=$(jq -nc --arg ws "$GITHUB_WORKSPACE" --arg tmp "$RUNNER_TEMP" --arg ssh "$HOME/.ssh" --arg key "$RUNNER_TEMP/gateway-key" '{apiKeyHelper: ("cat " + $key), showThinkingSummaries: true, sandbox: {enabled: true, failIfUnavailable: true, allowUnsandboxedCommands: false, autoAllowBashIfSandboxed: true, filesystem: {denyRead: [$key], denyWrite: [$tmp, $ssh], allowWrite: [$ws, "~/.cache", "~/.yarn", "~/.npm", "~/.config"]}, network: {allowedDomains: ["registry.npmjs.org", "registry.yarnpkg.com", "repo.yarnpkg.com", "github.com", "codeload.github.com"]}}}')
          set +e
          # The inner limit leaves time for the result file below; the step limit is the outer guard.
          PATH="$HOME/agent-bin:$PATH" timeout --kill-after=30s 36m claude -p "$(cat .tmp/trusted/.github/audit-autofix/repair-prompt.md)" \
            --model "$MODEL" --settings "$settings" \
            --allowedTools 'Bash,Read,Edit,Write,Glob,Grep' \
            --max-turns 120 --output-format stream-json --verbose \
            | tee "$WORK_DIR/claude-transcript.jsonl" \
            | jq -R --unbuffered -r -f .tmp/trusted/.github/audit-autofix/progress.jq
          code=${PIPESTATUS[0]}
          set -e
          jq -c 'select(.type == "result")' "$WORK_DIR/claude-transcript.jsonl" | tail -n 1 > "$WORK_DIR/claude-run.json"
          exit "$code"

      - name: Record the agent outcome
        if: ${{ always() && steps.plan.outputs.action == 'llm' }}
        run: |
          echo "agent outcome: ${{ steps.agent.outcome }}"
          jq '{is_error, num_turns, total_cost_usd, denials: ((.permission_denials // []) | length)}' "$WORK_DIR/claude-run.json" || true
          cat .tmp/audit-autofix/repair-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Repair allowScripts
        if: ${{ steps.plan.outputs.action == 'repair' && contains(fromJSON(steps.plan.outputs.steps), 'allow-scripts') }}
        run: |
          # Fails when a package moved to a path allowScripts has no entry for; the next command adds it.
          yarn install --mode=skip-build || true
          yarn allow-scripts auto
          code=0
          node .tmp/trusted/.github/scripts/allow-scripts-reconcile.mts \
            --base "$WORK_DIR/package.base.json" --auto package.json \
            --before "$WORK_DIR/yarn.base.lock" --after yarn.lock \
            --out "$WORK_DIR/allow-scripts.json" || code=$?
          echo "allow-scripts-reconcile exit code: $code (1 means unrelated entries were dropped)"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.lavamoat.allowScripts = JSON.parse(fs.readFileSync(process.env.WORK_DIR + '/allow-scripts.json', 'utf8'));
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          yarn lint:json:fix

      - name: Deduplicate the lockfile
        if: ${{ steps.plan.outputs.action == 'repair' && contains(fromJSON(steps.plan.outputs.steps), 'dedupe') }}
        run: yarn dedupe

      - name: Download the LavaMoat policy diffs from CI
        if: ${{ steps.plan.outputs.action == 'repair' && contains(fromJSON(steps.plan.outputs.steps), 'lavamoat-policy') }}
        uses: actions/download-artifact@v7
        with:
          path: ${{ env.WORK_DIR }}/policy-diffs
          pattern: lavamoat-policy-diff-*
          merge-multiple: true
          run-id: ${{ steps.run.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Apply the LavaMoat policy diffs
        if: ${{ steps.plan.outputs.action == 'repair' && contains(fromJSON(steps.plan.outputs.steps), 'lavamoat-policy') }}
        run: node .tmp/trusted/.github/scripts/lavamoat-apply-ci-diff.mts --dir "$WORK_DIR/policy-diffs"

      - name: Verify the repaired tree
        id: changes
        if: ${{ steps.plan.outputs.action == 'repair' || (steps.plan.outputs.action == 'llm' && steps.agent.outcome == 'success') }}
        env:
          STEPS: ${{ steps.plan.outputs.steps }}
        run: |
          yarn install --immutable --mode=skip-build
          # An allowScripts-only repair leaves the lock alone, so a pending dedupe waits for its own round.
          if [ "${{ steps.plan.outputs.action }}" = llm ] || jq -e 'index("dedupe")' <<< "$STEPS" > /dev/null; then
            yarn dedupe --check
          fi
          # The same paths the autofix workflow may change; anything else is a bug here.
          stray=$(git diff --name-only | grep -v -E '^(package\.json|yarn\.lock|\.yarn/patches/|lavamoat/webpack/)' || true)
          if [ -n "$stray" ]; then
            echo "::error::Repair changed files outside the allowed paths: $stray"
            exit 1
          fi
          # The lint proof below runs this package.json's scripts, so only the dependency sections may differ.
          strip='del(.dependencies, .devDependencies, .resolutions, .lavamoat)'
          if [ "$(git show HEAD:package.json | jq -S "$strip")" != "$(jq -S "$strip" package.json)" ]; then
            echo "::error::Repair changed package.json outside the dependency sections"
            exit 1
          fi
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The repair changed nothing."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --binary > "$WORK_DIR/repair.patch"
            git diff --stat
          fi

      # The agent proves its own fix, but only this step is trusted: it runs the failing check
      # itself on the final tree, and a failure stops the push.
      - name: Prove the lint fix
        id: prove
        if: ${{ steps.changes.outputs.changed == 'true' && steps.plan.outputs.action == 'llm' && (contains(fromJSON(steps.inputs.outputs.kinds), 'lint-heap') || contains(fromJSON(steps.inputs.outputs.kinds), 'lint')) }}
        run: yarn lint:eslint

      - name: Upload the run files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-repair
          path: |
            .tmp/audit-repair/
            .tmp/audit-autofix/
          if-no-files-found: ignore

      - name: Get token
        id: token
        if: ${{ steps.changes.outputs.changed == 'true' && env.DRY_RUN != 'true' && github.repository == 'MetaMask/metamask-extension' && vars.TOKEN_EXCHANGE_URL != '' }}
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write

      - name: Commit and push the repair
        id: push
        if: ${{ steps.changes.outputs.changed == 'true' && env.DRY_RUN != 'true' }}
        env:
          # The fork test uses a PAT; the real repository uses the exchanged token. A push with
          # the default token would not start CI again.
          GH_TOKEN: ${{ steps.token.outputs.token || secrets.AUDIT_AUTOFIX_PAT }}
          HEAD_BRANCH: ${{ steps.run.outputs.head-branch }}
          RUN_ID: ${{ steps.run.outputs.run-id }}
          STEPS: ${{ steps.plan.outputs.steps }}
          SIGNATURE: ${{ steps.plan.outputs.signature }}
          REPAIRS: ${{ steps.base.outputs.repairs }}
        run: |
          test -n "$GH_TOKEN"
          echo "::add-mask::$GH_TOKEN"
          case "$HEAD_BRANCH" in audit-autofix) ;; *) echo "::error::Refusing to push $HEAD_BRANCH"; exit 1 ;; esac
          git config user.name 'MetaMask Bot'
          git config user.email 'metamaskbot@users.noreply.github.com'
          git add package.json yarn.lock .yarn/patches lavamoat/webpack
          label=$(jq -r 'join(", ")' <<< "$STEPS")
          git commit -m "bump: repair audit fix (${label:-agent repair})" \
            -m "Repair-Round: $((REPAIRS + 1))" \
            -m "Repair-Signature: $SIGNATURE" \
            -m "Repair-Run: $RUN_ID"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$HEAD_BRANCH"

      - name: Record what happened
        id: outcome
        if: ${{ always() }}
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          AGENT: ${{ steps.agent.outcome }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          VERIFY: ${{ steps.changes.outcome }}
          PROVE: ${{ steps.prove.outcome }}
          PUSH: ${{ steps.push.outcome }}
        run: |
          outcome=unfinished
          if [ "$PUSH" = success ]; then
            outcome=pushed
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          elif [ "$PUSH" = failure ]; then outcome=push-failed
          elif [ "$PROVE" = failure ]; then outcome=proof-failed
          elif [ "$VERIFY" = failure ]; then outcome=verify-failed
          elif [ "$AGENT" = failure ]; then outcome=agent-failed
          elif [ "$CHANGED" = false ]; then outcome=no-change
          elif [ "$CHANGED" = true ] && [ "$DRY_RUN" = true ]; then outcome=dry-run
          elif [ "$ACTION" = needs-human ] || [ "$ACTION" = none ] || [ "$ACTION" = retry ]; then outcome="$ACTION"
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

  # A green Main ends the loop: close the comment, since the repair job does not run.
  passed:
    name: Report a green Main
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout the trusted scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
            .nvmrc
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Post the status comment
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          node .github/scripts/audit-repair-report.mts --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --run-id "$RUN_ID" \
            --repairs 0 --cap "$REPAIR_CAP" --outcome green \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # Its own job, so the token that can comment is never in the job that runs the agent.
  report:
    name: Report on the PR
    needs: repair
    if: ${{ always() && needs.repair.result != 'skipped' && needs.repair.outputs.head-branch != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout the trusted scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
            .nvmrc
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Missing when the run died before it uploaded anything; the comment then says so.
      - name: Download the run files
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: audit-repair
          path: .tmp/report-in

      - name: Post the status comment
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.repair.outputs.outcome }}
          SHA: ${{ needs.repair.outputs.sha }}
          BRANCH: ${{ needs.repair.outputs.head-branch }}
          RUN_ID: ${{ needs.repair.outputs.run-id }}
          REPAIRS: ${{ needs.repair.outputs.repairs }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --run-id "$RUN_ID" --repairs "${REPAIRS:-0}"
            --cap "$REPAIR_CAP" --outcome "${OUTCOME:-unfinished}" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [ -n "$SHA" ]; then args+=(--sha "$SHA"); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node .github/scripts/audit-repair-report.mts "${args[@]}"
