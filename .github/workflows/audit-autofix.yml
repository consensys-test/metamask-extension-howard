name: Audit autofix

# Prepares a draft PR that fixes the advisories in the open "Yarn Audit" bot issues.
# An agent (Claude Code through LiteLLM, sandboxed) edits the dependency files; scripts
# under .github/scripts check the result and write the PR. A human reviews and merges.

on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Issue numbers (comma-separated) or "open"'
        default: open
        type: string
      dry-run:
        description: 'Do everything except pushing the branch and opening the PR'
        default: true
        type: boolean
      rolling-retry:
        description: 'Set by the workflow when it starts itself again after the branch moved; leave at 0'
        default: '0'
        type: string
  # Daily sweep for issues that arrived while another autofix PR was open. Runs after the overnight Main.
  schedule:
    - cron: '0 8 * * *'
  # TEMPORARY (2/2): test runs on a trigger-ci branch (always dry-run). Remove this
  # trigger once the workflow is on main and has been run with workflow_dispatch.
  push:
    branches:
      - trigger-ci-audit-autofix
    paths:
      - .github/workflows/audit-autofix.yml
      - .github/audit-autofix/**

permissions: {}

concurrency:
  group: audit-autofix
  cancel-in-progress: false

env:
  LITELLM_BASE_URL: https://litellm.consensys.info
  MODEL: claude-sonnet-5-5
  CLAUDE_CODE_VERSION: 2.1.323
  # TEMPORARY (2/2): once the push trigger is gone this is just `inputs.dry-run`.
  DRY_RUN: ${{ github.event_name == 'push' || inputs.dry-run }}
  WORK_DIR: .tmp/audit-autofix
  # TEMPORARY (2/2): the bot issues live upstream, so push-triggered fork runs read them from there.
  # Once the push trigger is gone this is just `github.repository`.
  ISSUES_REPO: ${{ github.event_name == 'push' && 'MetaMask/metamask-extension' || github.repository }}

jobs:
  fix:
    name: Triage and fix
    # The sandbox setup below is tested on both 24.04 and 26.04 (ubuntu-latest moves between them).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
      actions: write # start the one retry run when the branch moved
    steps:
      # An open PR on the audit-autofix branch means this run rolls onto it instead of starting a new one.
      - name: Find the open audit PR
        id: open-pr
        uses: actions/github-script@v9
        with:
          script: |
            const open = (
              await github.paginate(github.rest.pulls.list, {
                ...context.repo,
                state: 'open',
                per_page: 100,
              })
            ).filter((pr) => pr.head.ref === 'audit-autofix');
            core.info(`open audit PRs: ${open.length}`);
            if (open.length === 1) {
              core.setOutput('number', open[0].number);
              core.setOutput('branch', open[0].head.ref);
              core.setOutput('sha', open[0].head.sha);
            }

      - name: Checkout and install
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          ref: ${{ steps.open-pr.outputs.sha }}
          # TEMPORARY (1/2): false while this workflow is developed. Set to true when the PR is opened.
          is-high-risk-environment: false
          persist-credentials: false

      - name: Audit the current checkout
        run: |
          mkdir -p "$WORK_DIR"
          yarn tsx .github/scripts/yarn-audit-and-triage.mts
          cp .tmp/audit-current.json "$WORK_DIR/audit-before.json"

      - name: Select the issues to fix
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ inputs.issues || 'open' }}
          ROLLING_PR: ${{ steps.open-pr.outputs.number }}
        run: |
          args=(--issues "$ISSUES")
          if [ -n "$ROLLING_PR" ]; then args+=(--rolling-pr "$ROLLING_PR"); fi
          yarn tsx .github/scripts/audit-autofix.mts select "${args[@]}"

      - name: Build the per-consumer fix table
        if: ${{ steps.select.outputs.has-work == 'true' }}
        run: yarn tsx .github/scripts/audit-consumers.mts --audit "$WORK_DIR/audit-before.json" --out "$WORK_DIR/consumers.md"

      - name: Install bubblewrap, socat and a narrow AppArmor profile
        if: ${{ steps.select.outputs.has-work == 'true' }}
        run: |
          sudo apt-get install -y bubblewrap socat
          # 26.04 ships a stock bwrap profile whose restricted child blocks the nested user
          # namespace that Claude Code's seccomp helper needs, so replace it.
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
            sudo rm /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --unshare-user --dev /dev unshare -U true
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 hides the key from the sandbox but also makes
      # package.json and yarn.lock read-only there. Instead the key lives in a file that
      # only apiKeyHelper (run by Claude outside the sandbox) can read.
      - name: Write the gateway key file
        if: ${{ steps.select.outputs.has-work == 'true' }}
        env:
          GATEWAY_KEY: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/gateway-key"
          printf '%s' "$GATEWAY_KEY" > "$RUNNER_TEMP/gateway-key"

      - name: Run the agent in the Claude Code sandbox
        id: agent
        if: ${{ steps.select.outputs.has-work == 'true' }}
        timeout-minutes: 40
        # The gate below decides whether a timed-out or failed run produced anything usable.
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: ${{ env.LITELLM_BASE_URL }}
          BASH_DEFAULT_TIMEOUT_MS: '1800000'
          BASH_MAX_TIMEOUT_MS: '1800000'
        run: |
          mkdir -p ~/.cache ~/.yarn ~/.npm ~/.config ~/.ssh ~/agent-bin
          # Yarn ignores the standard proxy variables, so the sandbox needs this wrapper.
          real_yarn=$(command -v yarn)
          # shellcheck disable=SC2016 # the wrapper must keep ${...} literal until it runs
          printf '#!/usr/bin/env bash\nexport YARN_HTTP_PROXY="${YARN_HTTP_PROXY:-$HTTP_PROXY}" YARN_HTTPS_PROXY="${YARN_HTTPS_PROXY:-$HTTPS_PROXY}"\nexec %s "$@"\n' "$real_yarn" > ~/agent-bin/yarn
          chmod +x ~/agent-bin/yarn
          settings=$(jq -nc --arg ws "$GITHUB_WORKSPACE" --arg tmp "$RUNNER_TEMP" --arg ssh "$HOME/.ssh" --arg key "$RUNNER_TEMP/gateway-key" '{apiKeyHelper: ("cat " + $key), showThinkingSummaries: true, sandbox: {enabled: true, failIfUnavailable: true, allowUnsandboxedCommands: false, autoAllowBashIfSandboxed: true, filesystem: {denyRead: [$key], denyWrite: [$tmp, $ssh], allowWrite: [$ws, "~/.cache", "~/.yarn", "~/.npm", "~/.config"]}, network: {allowedDomains: ["registry.npmjs.org", "registry.yarnpkg.com", "repo.yarnpkg.com", "github.com", "codeload.github.com"]}}}')
          # The pipe prints thinking, messages and commands to the live log; the transcript keeps everything.
          set +e
          PATH="$HOME/agent-bin:$PATH" claude -p "$(cat .github/audit-autofix/prompt.md)" \
            --model "$MODEL" --settings "$settings" \
            --allowedTools 'Bash,Read,Edit,Write,Glob,Grep' \
            --max-turns 120 --output-format stream-json --verbose \
            | tee "$WORK_DIR/claude-transcript.jsonl" \
            | jq -R --unbuffered -r -f .github/audit-autofix/progress.jq
          code=${PIPESTATUS[0]}
          set -e
          jq -c 'select(.type == "result")' "$WORK_DIR/claude-transcript.jsonl" | tail -n 1 > "$WORK_DIR/claude-run.json"
          exit "$code"

      - name: Record the agent outcome
        if: ${{ always() && steps.select.outputs.has-work == 'true' }}
        run: |
          echo "agent outcome: ${{ steps.agent.outcome }}"
          jq '{is_error, num_turns, total_cost_usd, denials: ((.permission_denials // []) | length)}' "$WORK_DIR/claude-run.json" || true
          ls -la "$WORK_DIR"

      - name: Check which paths changed
        id: gate
        if: ${{ steps.select.outputs.has-work == 'true' }}
        run: |
          code=0
          yarn tsx .github/scripts/audit-autofix.mts gate || code=$?
          echo "changed=$([ "$code" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "gate exit code: $code"
          [ "$code" = 0 ] || [ "$code" = 3 ]

      - name: Save the base files
        if: ${{ steps.gate.outputs.changed == 'true' }}
        run: |
          git show HEAD:package.json > "$WORK_DIR/package.base.json"
          git show HEAD:yarn.lock > "$WORK_DIR/yarn.base.lock"

      - name: Remove dead pins and unused patches
        if: ${{ steps.gate.outputs.changed == 'true' }}
        run: yarn tsx .github/scripts/prune-dead-pins.mts --out "$WORK_DIR/dead-pins.md"

      - name: Sort the resolutions
        if: ${{ steps.gate.outputs.changed == 'true' }}
        run: yarn tsx .github/scripts/resolutions-lint.mts --base "$WORK_DIR/package.base.json" --fix

      - name: Repair allowScripts and check the install
        id: verify
        if: ${{ steps.gate.outputs.changed == 'true' }}
        run: |
          # Fails when the agent moved a package to a path allowScripts has no entry for; the next command adds it.
          yarn install --mode=skip-build || true
          yarn allow-scripts auto
          code=0
          yarn tsx .github/scripts/allow-scripts-reconcile.mts \
            --base "$WORK_DIR/package.base.json" --auto package.json \
            --before "$WORK_DIR/yarn.base.lock" --after yarn.lock \
            --out "$WORK_DIR/allow-scripts.json" || code=$?
          echo "allow-scripts-reconcile exit code: $code (1 means unrelated entries were dropped)"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.lavamoat.allowScripts = JSON.parse(fs.readFileSync(process.env.WORK_DIR + '/allow-scripts.json', 'utf8'));
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          yarn lint:json:fix
          yarn install --immutable --mode=skip-build
          yarn dedupe --check

      - name: Smoke-test the lint and dependency tooling
        if: ${{ steps.gate.outputs.changed == 'true' }}
        run: yarn tsx .github/scripts/tooling-smoke.mts

      - name: Check lockfile churn and resolutions
        if: ${{ steps.gate.outputs.changed == 'true' }}
        run: |
          test -s "$WORK_DIR/targets.txt"
          yarn tsx .github/scripts/lockfile-churn-guard.mts \
            --before "$WORK_DIR/yarn.base.lock" --after yarn.lock \
            --targets "$(paste -sd, "$WORK_DIR/targets.txt")" \
            --out "$WORK_DIR/churn.md"
          yarn tsx .github/scripts/resolutions-lint.mts --base "$WORK_DIR/package.base.json"

      - name: Audit the result and compute the Closes lines
        if: ${{ steps.gate.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yarn tsx .github/scripts/yarn-audit-and-triage.mts
          cp .tmp/audit-current.json "$WORK_DIR/audit-after.json"
          yarn tsx .github/scripts/audit-closes.mts --advisories "$WORK_DIR/audit-after.json" | tee "$WORK_DIR/closes.md"

      - name: Test each added resolution
        if: ${{ steps.gate.outputs.changed == 'true' }}
        run: yarn tsx .github/scripts/resolution-necessity.mts --base "$WORK_DIR/package.base.json" --out "$WORK_DIR/necessity.md"

      - name: Write the PR body and the patch
        id: body
        if: ${{ steps.gate.outputs.changed == 'true' }}
        run: |
          yarn tsx .github/scripts/audit-autofix.mts body --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git diff --binary > "$WORK_DIR/audit-fix.patch"
          git diff --stat
          cat "$WORK_DIR/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the run files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-autofix
          path: .tmp/audit-autofix/
          if-no-files-found: ignore

      - name: Get token
        id: token
        if: ${{ steps.body.outcome == 'success' && env.DRY_RUN != 'true' && github.repository == 'MetaMask/metamask-extension' && vars.TOKEN_EXCHANGE_URL != '' }}
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write
            pull_requests: write

      - name: Push the branch and open the draft PR
        if: ${{ steps.body.outcome == 'success' && env.DRY_RUN != 'true' }}
        env:
          # The fork test uses a PAT; the real repository uses the exchanged token.
          GH_TOKEN: ${{ steps.token.outputs.token || secrets.AUDIT_AUTOFIX_PAT }}
          GH_REPO: ${{ github.repository }}
          ACTIONS_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ steps.open-pr.outputs.number }}
          PR_BRANCH: ${{ steps.open-pr.outputs.branch }}
          PR_SHA: ${{ steps.open-pr.outputs.sha }}
          ISSUES: ${{ inputs.issues || 'open' }}
          RETRY: ${{ inputs.rolling-retry || '0' }}
        run: |
          test -n "$GH_TOKEN"
          echo "::add-mask::$GH_TOKEN"
          git config user.name 'MetaMask Bot'
          git config user.email 'metamaskbot@users.noreply.github.com'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          push() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push "$@"; }
          # The repair loop counts only its own commits after the last one carrying this trailer.
          commit() { git commit -m 'bump: fix audit advisories' -m "Audit-Autofix: $GITHUB_RUN_ID"; }
          if [ -z "$PR_BRANCH" ]; then
            branch=audit-autofix
            git checkout -b "$branch"
            git add package.json yarn.lock .yarn/patches lavamoat/webpack
            commit
            # No open PR uses the branch, so anything on it is left over from a merged or closed PR.
            old=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$branch" | cut -f1)
            lease=()
            if [ -n "$old" ]; then lease+=(--force-with-lease="refs/heads/$branch:$old"); fi
            push "${lease[@]}" origin "HEAD:refs/heads/$branch"
            gh pr create --draft --base main --head "$branch" \
              --title 'bump: fix audit advisories' --body-file "$WORK_DIR/pr-body.md"
            exit 0
          fi
          # Rolling: add a commit to the open PR. The lease fails when the branch moved during the run
          # (a repair, a person or another run) or the PR was merged and its branch deleted.
          git add package.json yarn.lock .yarn/patches lavamoat/webpack
          commit
          if ! push --force-with-lease="refs/heads/$PR_BRANCH:$PR_SHA" origin "HEAD:refs/heads/$PR_BRANCH"; then
            if [ "$RETRY" = 0 ]; then
              echo "::warning::$PR_BRANCH moved during the run; starting one more run from its new head."
              GH_TOKEN="$ACTIONS_TOKEN" gh workflow run audit-autofix.yml --ref "$DEFAULT_BRANCH" \
                -f issues="$ISSUES" -f dry-run=false -f rolling-retry=1
              exit 0
            fi
            echo "::error::$PR_BRANCH moved again; the sweep will pick the issues up."
            exit 1
          fi
          # Read the body right before writing it, so a person's edit is not overwritten.
          { gh pr view "$PR_NUMBER" --json body --jq .body; printf '\n\n---\n\n'; cat "$WORK_DIR/pr-section.md"; } > "$WORK_DIR/pr-body-rolled.md"
          gh pr edit "$PR_NUMBER" --body-file "$WORK_DIR/pr-body-rolled.md"
