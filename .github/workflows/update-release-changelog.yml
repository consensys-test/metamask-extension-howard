name: Update Release Changelog PR

on:
  push:
    branches:
      - 'release/[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: update-release-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-changelog:
    name: Update changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Get token
        id: token
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write
            pull_requests: write

      - name: Update Release Changelog
        uses: MetaMask/github-tools/.github/actions/update-release-changelog@8f2dd8d6f69dd22e909e0166aafceabfad4088ad
        env:
          AI_ANALYZER_LITELLM_KEY: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
        with:
          release-branch: ${{ github.ref_name }}
          repository-url: https://github.com/MetaMask/metamask-extension
          platform: extension
          previous-version-ref: 'null'
          github-token: ${{ steps.token.outputs.token }}
