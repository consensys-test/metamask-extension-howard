name: Update Release Changelog PR

on:
  push:
    branches:
      - 'release/[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: update-release-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-changelog:
    name: Update changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update Release Changelog
        uses: MetaMask/github-tools/.github/actions/update-release-changelog@4c835c4d918140e9fbb34699cf8213e61a74cbb8
        env:
          AI_ANALYZER_LITELLM_KEY: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
        with:
          release-branch: ${{ github.ref_name }}
          repository-url: ${{ github.server_url }}/${{ github.repository }}
          platform: extension
          previous-version-ref: 'null'
          github-token: ${{ secrets.PR_TOKEN }}
