# Fork-only fixture workflow. Runs the candidate github-tools action on every release branch push.
name: Update Release Changelog PR

on:
  push:
    branches:
      - 'release/*'

concurrency:
  group: update-release-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-changelog:
    name: Update changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update Release Changelog
        uses: MetaMask/github-tools/.github/actions/update-release-changelog@c4d7e154afc5a4e7a24660b0f283bf2b32c8b1aa
        env:
          AI_ANALYZER_LITELLM_KEY: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
        with:
          release-branch: ${{ github.ref_name }}
          repository-url: https://github.com/MetaMask/metamask-extension
          platform: extension
          github-token: ${{ secrets.PR_TOKEN }}
