name: Update Release Changelog PR

on:
  push:
    branches:
      - 'release/[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: update-release-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-changelog:
    name: Update changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update Release Changelog
        uses: MetaMask/github-tools/.github/actions/update-release-changelog@1e0bfc6d2bf47736731111321b266185a859ca40
        env:
          AI_ANALYZER_LITELLM_KEY: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
          RELEASE_CHANGELOG_RACE_TEST_PAUSE_MS: '45000'
          RELEASE_CHANGELOG_RACE_TEST_READY_BRANCH: race-test-ready-106-0-0
        with:
          release-branch: ${{ github.ref_name }}
          repository-url: ${{ github.server_url }}/${{ github.repository }}
          platform: extension
          previous-version-ref: 'null'
          github-token: ${{ secrets.PR_TOKEN }}
          auto-changelog-ref: 2c6add72405d66b70b2566e719c2ae8f0a64603f
