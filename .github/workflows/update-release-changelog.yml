# Fork copy of Extension's real workflow; v1 replaced by the candidate sha, token from a secret.
name: Update Release Changelog PR

on:
  push:
    branches:
      - 'release/[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: update-release-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-changelog:
    name: Update changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Update Release Changelog
        uses: MetaMask/github-tools/.github/actions/update-release-changelog@v1
        with:
          release-branch: ${{ github.ref_name }}
          repository-url: https://github.com/MetaMask/metamask-extension
          platform: extension
          previous-version-ref: 'null'
          github-token: ${{ secrets.PR_TOKEN }}
