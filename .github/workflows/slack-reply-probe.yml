name: Slack reply probe

# TEMPORARY: runs the audit Slack reply script with each reply kind. Delete after the test.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'opened, done or stopped'
        default: done
        type: string
      outcome:
        description: 'Outcome shown for a stopped loop'
        default: needs-human
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  probe:
    name: Reply
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts
            .nvmrc
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Reply
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          KIND: ${{ inputs.kind }}
          OUTCOME: ${{ inputs.outcome }}
        run: node .github/scripts/audit-slack-reply.mts --kind "$KIND" --branch audit-autofix --outcome "$OUTCOME" --status-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
