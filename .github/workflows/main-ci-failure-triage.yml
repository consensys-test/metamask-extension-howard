# Classify and retry failed Main workflow runs.
#
# Triggered by `workflow_run` on every Main completion. Skips successes
# and fork runs at the job level. For failures, it:
#
#   1. Classifies each failed job as retryable or non-retryable
#   2. Writes a markdown report to the step summary
#   3. Sends a structured log to Sentry (if SENTRY_DSN_PERFORMANCE is set)
#
# Retry is label-gated for all events that have an originating PR:
#
#   - pull_request / merge_group:
#     Retry only when the `retry-ci` label is present on the PR.
#     For merge_group, the PR number is extracted from the branch name
#     (gh-readonly-queue/{base}/pr-{N}-{sha}).
#
#   - push to main/stable:
#     Observation only — no retry (no originating PR to label).
#
# Reruns call `gh run rerun --failed`, which triggers a new Main
# completion → workflow_run fires again.
#
# Merge queue interaction:
#   The merge queue has two rules (configured in the repository ruleset):
#
#   1. "Require merge queue" > "Require all queue entries to pass
#      required checks" (ALLGREEN) — monitors check suites directly.
#      When Main's suite fails, this rule wants to eject immediately.
#
#   2. "Require status checks to pass" > "All jobs pass" — monitors
#      the commit status posted by ci-status-gate in main.yml.
#
#   Both must agree before the queue merges or ejects. ci-status-gate
#   exploits this: on early merge_group failures, it skips posting
#   the commit status when retry-ci is present, keeping rule 2 pending.
#   This blocks rule 1 from ejecting, giving triage time to retry.
#
#   When triage calls `gh run rerun --failed`, it resets Main's check
#   suite to in_progress and triggers a new attempt. On the final
#   attempt (no retry-ci label), ci-status-gate posts the commit
#   status, unblocking the queue to merge or eject.

name: Main CI Failure Triage

on:
  workflow_run:
    workflows: ['Main']
    types: [completed]

jobs:
  classify-and-retry:
    name: Classify & retry
    # Gate: only spin up a runner for events worth classifying.
    #
    # Pseudocode:
    #   if run.conclusion != 'failure'        → skip (nothing to classify)
    #   if run.repo != run.head_repo          → skip (fork — no permissions)
    #   if run.event == 'merge_group'         → run  (label-gated retry via PR)
    #   if run.event == 'pull_request'        → run  (label-gated retry via PR)
    #   if run.event == 'push'
    #     and run.branch in ['main','stable'] → run  (observation only — no retry)
    #   else                                  → skip (release/*, workflow_dispatch, etc.)
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_repository.full_name == github.event.workflow_run.repository.full_name &&
        (
          github.event.workflow_run.event == 'merge_group'
          || github.event.workflow_run.event == 'pull_request'
          || (github.event.workflow_run.event == 'push'
              && contains(fromJson('["main","stable"]'), github.event.workflow_run.head_branch))
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      # TODO: Remove CHECK_RUN_TOKEN — fork-only workaround. On the real repo,
      # github.token creates checks in the correct suite. Delete this env var
      # and the corresponding logic in classify-failures.mts.
      CHECK_RUN_TOKEN: ${{ secrets.CHECK_RUN_TOKEN }}
      MAIN_RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      # Only populated for pull_request events; empty for merge_group/push.
      # The "Resolve PR number" step also extracts PR from the branch name
      # for merge_group events, so this env var is not the only source.
      PR_NUMBER_FROM_EVENT: ${{ github.event.workflow_run.pull_requests[0].number }}
      REPO: ${{ github.repository }}
      SENTRY_DSN_PERFORMANCE: ${{ vars.SENTRY_DSN_PERFORMANCE }}
      WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - name: Checkout .github/ directory
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            .nvmrc
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install Sentry SDK
        run: npm install --no-save @sentry/node@^10.30.0

      - name: Get version from package.json
        run: |
          TMPFILE=$(mktemp)
          if curl -sSf -o "$TMPFILE" "https://raw.githubusercontent.com/${REPO}/${HEAD_SHA}/package.json"; then
            echo "VERSION=$(node -p "JSON.parse(require('fs').readFileSync('$TMPFILE','utf8')).version")" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not download package.json — VERSION will be 'unknown'"
          fi
          rm -f "$TMPFILE"

      - name: Classify failures
        id: classify
        run: node .github/scripts/classify-failures.mts

      # Resolve the originating PR number so the retry step can check
      # for the retry-ci label. For push events there is no PR.
      - name: Resolve PR number
        id: resolve-pr
        run: |
          if [[ "$WORKFLOW_EVENT" == "pull_request" ]]; then
            echo "pr-number=${PR_NUMBER_FROM_EVENT}" >> "$GITHUB_OUTPUT"
          elif [[ "$WORKFLOW_EVENT" == "merge_group" && "$HEAD_BRANCH" =~ gh-readonly-queue/[^/]+/pr-([0-9]+)- ]]; then
            echo "pr-number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "No originating PR for event '$WORKFLOW_EVENT'. Retry not available."
            echo "pr-number=" >> "$GITHUB_OUTPUT"
          fi

      # -- Label-gated retry: requires `retry-ci` label on the originating PR --
      - name: Retry (if retry-ci label)
        id: retry
        if: ${{ steps.resolve-pr.outputs.pr-number != '' }}
        run: |
          PR="${{ steps.resolve-pr.outputs.pr-number }}"

          CURRENT_LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' | tr '\n' ',')
          if [[ "${CURRENT_LABELS}" != *"retry-ci"* ]]; then
            echo "No retry-ci label on PR #$PR. Skipping."
            echo "retried=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found retry-ci label on PR #$PR. Removing label..."
          gh pr edit "$PR" --repo "$REPO" --remove-label "retry-ci"

          echo "Rerunning failed jobs..."
          gh run rerun "$MAIN_RUN_ID" --failed --repo "$REPO"
          echo "retried=true" >> "$GITHUB_OUTPUT"
          echo "Rerun triggered."
