name: Repository health checks

on:
  workflow_call:

jobs:
  repository-health-checks:
    name: Repository health checks
    runs-on: ubuntu-latest
    env:
      # For a `pull_request` event, the branch is `github.head_ref``.
      # For a `push` event, the branch is `github.ref_name`.
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: ShellCheck Lint
        if: ${{ !cancelled() }}
        run: ./development/shellcheck.sh

      - name: Validate changelog
        if: ${{ !startsWith(env.BRANCH, 'release/') }}
        run: yarn lint:changelog

      - name: Validate release candidate changelog
        if: ${{ startsWith(env.BRANCH, 'release/') }}
        run: .github/scripts/validate-changelog-in-rc.sh

      - name: Lint lockfile
        if: ${{ !cancelled() }}
        run: yarn lint:lockfile

      - name: Lint console baseline
        if: ${{ !cancelled() }}
        run: yarn lint:baseline

      - name: Check yarn resolutions
        if: ${{ !cancelled() }}
        run: yarn --check-resolutions

      - name: Run audit
        if: ${{ !cancelled() }}
        run: yarn audit

      - name: Detect yarn lock deduplications
        if: ${{ !cancelled() }}
        run: yarn dedupe --check

      - name: Run depcheck
        if: ${{ !cancelled() }}
        run: yarn depcheck

      - name: Validate allow-scripts config
        if: ${{ !cancelled() }}
        run: yarn allow-scripts auto

      - name: Check feature flag registry
        if: ${{ !cancelled() }}
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: yarn tsx .github/scripts/check-feature-flag-registry.ts

      - name: Check working tree
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --exit-code; then
              echo "::error::Working tree dirty."
              exit 1
          fi

      - name: Run fitness functions
        if: ${{ !cancelled() && github.event_name == 'pull_request'}}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the PR diff via GitHub API (avoids needing full git history).
          # Falls back to git diff using the base SHA from the event payload.
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
               -H "Accept: application/vnd.github.diff" > ./diff 2>/dev/null && [ -s ./diff ]; then
            echo "Got diff from GitHub API"
          else
            echo "::warning::GitHub API diff unavailable or empty, falling back to git diff"
            git fetch origin "${BASE_SHA}" --depth=1
            git diff "${BASE_SHA}" HEAD -- . > ./diff
          fi

          yarn fitness-functions ci ./diff
