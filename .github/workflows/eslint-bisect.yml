name: ESLint memory bisect (fork only)

# TEMPORARY (1/1): checks a parent-scoped minimatch resolution on the audit tree instead of the
# typescript-eslint 8.73.0 bump. Remove with the trigger-ci-eslint-bisect branch.

on:
  push:
    branches:
      - trigger-ci-eslint-bisect

permissions:
  contents: read

jobs:
  scoped:
    name: scoped resolution (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name-only
          - with-ranges
    steps:
      - uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Pin typescript-eslint to 8.62.0 and scope the minimatch fix
        env:
          VARIANT: ${{ matrix.variant }}
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const r = pkg.resolutions;
            for (const n of ["typescript-eslint", "parser", "eslint-plugin", "project-service", "scope-manager", "tsconfig-utils", "type-utils", "types", "utils", "visitor-keys"]) {
              r[n === "typescript-eslint" ? n : "@typescript-eslint/" + n] = "8.62.0";
            }
            if (process.env.VARIANT === "name-only") {
              r["@typescript-eslint/typescript-estree/minimatch"] = "11.0.8";
            } else {
              r["@typescript-eslint/typescript-estree@npm:8.62.0/minimatch@npm:^10.2.2"] = "11.0.8";
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          yarn install --mode=skip-build

      - name: Which minimatch each typescript-estree uses
        run: yarn why minimatch --recursive | grep -E -B1 -A3 "typescript-estree" | head -40

      - name: Dedupe check
        continue-on-error: true
        run: yarn dedupe --check

      - name: Lint with ESLint under the repo heap limit
        continue-on-error: true
        run: /usr/bin/time -v yarn lint:eslint 2> >(tee time.log >&2) ; grep -E "Maximum resident|Elapsed" time.log

      - name: Type check
        run: yarn lint:tsc
