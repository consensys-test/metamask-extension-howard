name: ESLint memory bisect (fork only)

# TEMPORARY (1/1): narrows which audit-autofix change makes `yarn lint:eslint` run out of memory.
# Remove with the trigger-ci-eslint-bisect branch once the cause is known.

on:
  push:
    branches:
      - trigger-ci-eslint-bisect

permissions:
  contents: read

jobs:
  eslint:
    name: eslint (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant:
          - as-is-heap-12288
          - as-is-heap-14336
          - typescript-eslint-8.70.1-measure
    steps:
      - uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Runner size
        run: |
          free -m
          nproc

      - name: Pin typescript-eslint for the measure variant
        if: ${{ endsWith(matrix.variant, '-measure') }}
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const n of ["typescript-eslint", "parser", "eslint-plugin", "project-service", "scope-manager", "tsconfig-utils", "type-utils", "types", "utils", "visitor-keys"]) {
              pkg.resolutions[n === "typescript-eslint" ? n : "@typescript-eslint/" + n] = "8.70.1";
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          yarn install --mode=skip-build

      - name: Lint with a larger heap
        if: ${{ startsWith(matrix.variant, 'as-is-heap-') }}
        env:
          HEAP_MB: ${{ endsWith(matrix.variant, '14336') && '14336' || '12288' }}
        run: |
          NODE_OPTIONS="--max-old-space-size=${HEAP_MB}" /usr/bin/time -v yarn eslint . -c ./.eslintrc.js --ext js,ts,tsx,snap 2> >(tee time.log >&2)

      - name: Lint with the repo script and measure peak memory
        if: ${{ endsWith(matrix.variant, '-measure') }}
        run: |
          /usr/bin/time -v yarn lint:eslint 2> >(tee time.log >&2) || true
          grep -E "Maximum resident|Elapsed" time.log
