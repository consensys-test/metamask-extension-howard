# Configuration for multimediallc/codeowners-plus.
# See: https://github.com/multimediallc/codeowners-plus

# Show a collapsible per-file owners list in the PR comment. Helpful for a big
# owner graph like this one — reviewers can quickly see why they were tagged.
detailed_reviewers = true

# Don't yell about unowned files during the trial. The translated rule set may
# legitimately leave some paths unowned, and we don't want noise in PR
# comments while we're shaking things out.
suppress_unowned_warning = true

# Treat the PR author as satisfying any OR ownership group they belong to, so
# authors who are themselves codeowners don't have to chase a second approver.
allow_self_approval = true

# Don't fail the codeowners-plus status check when reviews are missing; instead
# have the action post a GitHub approval on behalf of the token owner once
# every required group is satisfied. Lets the green check on the PR continue
# to reflect "PR code is healthy" rather than "all required reviewers
# approved", and lets native CODEOWNERS / branch protections do the gating.
[enforcement]
fail_check = false
approval = true
